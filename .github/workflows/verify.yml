name: verify

on:
  # push == deploy and branch protection isn't available on the current plan, so
  # verify runs on EVERY branch's pushes (covers main and all feature branches).
  # The local pre-push hook (.githooks/pre-push) is the first gate; this is the
  # safety net. pull_request trigger removed — it was a duplicate that fired a
  # second run for every PR push, doubling Actions spend with no extra coverage.
  push:
    branches:
      - "**" # any branch (matches names with slashes, unlike "*")

# Cancel any in-flight run on the same branch when a newer push lands.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine_test:
    name: engine_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/engine/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install engine
        run: pip install -e "apps/engine[dev]"

      - name: Naming check
        run: python3 scripts/check_naming.py

      - name: Engine tests
        run: PYTHONPATH=apps/engine python3 -m pytest apps/engine/tests -n auto

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate contracts
        # app import fails without pip; script falls back to committed openapi.json
        run: python3 scripts/generate_contracts.py

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # build script runs contracts:generate internally; python3 available on ubuntu-latest
        # without pip the script falls back to committed openapi.json
        run: pnpm build
