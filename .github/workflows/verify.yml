name: verify

on:
  # COST: CI runs ONLY on PRs against main (the actual gate before merge) + on
  # pushes to main itself (the deploy-safety net), NOT on every feature-branch
  # push. This kills the ~$0.30-per-agent-push spend — agents commit freely to
  # their branches for $0; verify runs once when a PR is opened/updated, and on
  # the merge to main. The local pre-push hook (.githooks/pre-push) is the fast
  # first gate. `workflow_dispatch` lets you run it manually on any branch.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel any in-flight run on the same branch when a newer push lands.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. `pull-requests: read` lets dorny/paths-filter call the PR
# listFiles API; without it the change-detection job fails "Resource not accessible by
# integration" and skips every downstream job — a false red on PRs (esp. agent-created).
permissions:
  contents: read
  pull-requests: read

jobs:
  # Cheap change-detection job (~5 s). All heavy jobs depend on its outputs.
  # Docs-only / .md-only / .claude/**-only pushes skip all three heavy jobs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'apps/engine/**'
              - 'pyproject.toml'
              - '**/pyproject.toml'
              - 'poetry.lock'
              - 'requirements*.txt'
              - 'scripts/check_naming.py'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '**/package.json'
              - 'scripts/generate_contracts.py'

  engine_test:
    name: engine_test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/engine/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install engine
        run: pip install -e "apps/engine[dev]"

      - name: Naming check
        run: python3 scripts/check_naming.py

      - name: Engine tests
        run: PYTHONPATH=apps/engine python3 -m pytest apps/engine/tests -n auto

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate contracts
        # app import fails without pip; script falls back to committed openapi.json
        run: python3 scripts/generate_contracts.py

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # build script runs contracts:generate internally; python3 available on ubuntu-latest
        # without pip the script falls back to committed openapi.json
        run: pnpm build
