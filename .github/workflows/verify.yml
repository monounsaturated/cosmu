name: verify

on:
  pull_request:
    branches:
      - main
  # Backstop: push == deploy and branch protection isn't available on the current
  # plan, so verify runs on EVERY branch's pushes, not just main. The local
  # pre-push hook (.githooks/pre-push) is the first gate; this is the safety net.
  push:
    branches:
      - "**" # any branch (matches names with slashes, unlike "*")

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/engine/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install engine (Python)
        run: pip install -e "apps/engine[dev]"

      - name: Run verify
        run: pnpm verify
