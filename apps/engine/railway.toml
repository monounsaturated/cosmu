# Railway config for the ENGINE service. Point the Railway service's Root Directory at `apps/engine` so this
# file drives it. We build via our own Dockerfile (Docker Hub python base) rather than nixpacks: nixpacks pulls
# its base from ghcr.io on every build (a ghcr.io 502 was failing deploys before they reached our code) and
# copied only pyproject.toml before install (empty wheel → runtime ModuleNotFoundError). The Dockerfile copies
# the full source before `pip install .`, so the package is real. We still run uvicorn via `python -m` so /app
# is on sys.path even if the install layer regresses. The web is hosted on Vercel — it is NOT built here.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'python -m uvicorn cosmu.api.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Bounded, scheduled research pass (NOT a daemon): free-data INGEST ONLY, then exits.
# The leaky cross-asset gate (no-FDR / trials=5) is DEFAULT OFF on this cron; pass --cross-asset-gate to opt in.
# Honest BH-FDR gate path (promote_cohort) is untouched and runs via the autonomy cron below.
[[cron]]
schedule = "0 */6 * * *"
command = "python3 -m cosmu.research.loop --ingest"

# Full autonomous cycle on REAL Binance data: ingest -> author -> gate/screen -> fund SIM survivors ->
# recommendations. Writes to the production DB (no --offline) and never runs the synthetic fixture.
# TOGGLE: ON by default (the autonomous loop IS the product; the tick is SIM-only and bounded). Set
# AUTONOMY_CRON_ENABLED=0 on the Railway service to skip instantly without a redeploy. LIVE STAYS OFF
# regardless (sim fills only); the ledger pause flag also stops it.
[[cron]]
schedule = "0 */4 * * *"
command = "python3 -m cosmu.master.scheduler"

# FORWARD-TEST CLOCK: STEP then MARK. Step = the executor (orchestrator/forward_step.py) re-evaluates each
# gate-lane track's OWN spec/params on the latest real bars and closes/re-opens through the one order path
# (SIM fills only — live stays off); mark = re-mark every held SIM position against the latest REAL close,
# routed by asset class (crypto -> Binance spot, equity/ETF -> Yahoo total-return). Daily at 22:10 UTC (after
# the US equity cash close) suits daily-bar strategies; bump to hourly if a faster-bar crypto track needs it.
# This is the hands-off floor: it makes the forward test a genuine strategy test, not buy-and-hold.
[[cron]]
schedule = "10 22 * * *"
command = "python3 -m cosmu.orchestrator.loop"

# ROTATION RE-ARM: re-run the deploy-lane arm fleet daily after the clock. Each arm() is idempotent (a held
# target leg is reused, the clock origin never resets) and now closes stale legs first (arm_rotation), so this
# is what makes the documented rotation strategies (GEM, GTAA, VAA, PAA, DAA, ...) actually ROTATE unattended
# when their monthly signals flip — before this cron, rotation only happened when the operator re-armed by hand.
[[cron]]
schedule = "40 22 * * *"
command = "python3 -m cosmu.research.arm_fleet"
