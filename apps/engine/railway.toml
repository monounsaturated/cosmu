# Railway config for the ENGINE service. Point the Railway service's Root Directory at `apps/engine` so this
# file (not the repo-root railway.toml, which is the legacy web build) drives it: nixpacks auto-detects the
# Python project (pyproject.toml with a build backend) and `pip install .` brings in the deps. NOTE: nixpacks
# copies only pyproject.toml before `pip install .`, so the built wheel contains NO cosmu source (deps install
# from the metadata; the package files arrive later via `COPY . /app`). We therefore run uvicorn via
# `python -m` so the WORKDIR (/app, where the copied cosmu source lives) is on sys.path — a bare `uvicorn`
# console script puts only the venv bin dir on the path and fails with ModuleNotFoundError. The crons below
# already use `python -m` for the same reason. The web is hosted on Vercel — it is NOT built here.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m uvicorn cosmu.api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Bounded, scheduled research pass (NOT a daemon): one free-data ingest + cross-asset gate run, then exits.
[[cron]]
schedule = "0 */6 * * *"
command = "python3 -m cosmu.research.loop --ingest"

# Full autonomous cycle: ingest -> author -> gate/screen -> fund paper survivors -> recommendations.
[[cron]]
schedule = "0 */4 * * *"
command = "python3 -m cosmu.master.scheduler"
