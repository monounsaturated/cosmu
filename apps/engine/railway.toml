# Railway config for the ENGINE service. Point the Railway service's Root Directory at `apps/engine` so this
# file drives it. We build via our own Dockerfile (Docker Hub python base) rather than nixpacks: nixpacks pulls
# its base from ghcr.io on every build (a ghcr.io 502 was failing deploys before they reached our code) and
# copied only pyproject.toml before install (empty wheel → runtime ModuleNotFoundError). The Dockerfile copies
# the full source before `pip install .`, so the package is real. We still run uvicorn via `python -m` so /app
# is on sys.path even if the install layer regresses. The web is hosted on Vercel — it is NOT built here.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'python -m uvicorn cosmu.api.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# REGION CO-LOCATION (page-speed): pin the single engine replica to europe-west4 (Amsterdam) — the closest
# Railway region to our Supabase Postgres at aws-1-eu-west-3 (Paris). The engine ran US-default, so every DB
# read paid a ~150ms+ transatlantic round-trip (a single warm query measured ~0.6s); same-region EU cuts that
# to ~10-20ms, which is what makes the dashboards feel instant. ONE replica → no extra cost (this is a region
# pin, NOT horizontal scaling). Everything else the engine talks to is global (Vercel web, Binance,
# OpenRouter), so moving to EU is strictly closer-to-DB and neutral elsewhere.
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1

# ── SCHEDULING IS OWNED BY MODAL, NOT RAILWAY ──────────────────────────────────────────────────────────
# The cron fleet was migrated to Modal (apps/engine/remote/app.py) — durable, free, and with a dead-man's-switch
# heartbeat. Railway runs ONLY the always-on API process above (it does not parse a top-level `[[cron]]` array,
# so the blocks that used to live here were dead config that merely LOOKED scheduled). They are removed to stop
# the file implying a scheduler Railway never ran.
#
# Modal fleet (Modal Free caps SCHEDULES at 5 — remote/app.py):
#   • ingest               hourly        — free-source point-in-time ingest
#   • tick                 every 4h      — discovery (author→gate/FDR→fund SIM) + paper clock (mark) + cohort
#                                           re-arm + vendor-cost budget refresh once/day. SIM only, never an order.
#   • heartbeat            hourly        — staleness dead-man's-switch (ingest/tick/mark) → Slack
#   • cold_tier_maintenance weekly       — alt_data → R2 DuckLake age-out
#   • daily_backup         daily         — Postgres → R2 (Free plan has no managed backups)
#
# NOT yet on the Modal fleet (the 5-schedule cap is full) — run on-demand via `modal run`, or add a SECOND
# free Modal app if these need to be unattended (operator call): daily OHLCV bar backfill, daily funding-rate
# backfill, venue_metadata/venue_fee_routing refresh, the hourly intraday (1h/4h) executor lane, and the
# hourly voices credibility pass. The paper-mark clock reads the bar cache, so let the bar/funding backfill
# lapse only knowingly — a dark backfill ages the marks (the heartbeat's mark-staleness alert is the backstop).
