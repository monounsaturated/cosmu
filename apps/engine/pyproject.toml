# Build backend so the engine is pip-installable (nixpacks/Railway run `pip install .` from this dir, installing
# the deps below + the cosmu package). Single source of truth for deps — no duplicated requirements.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmu-engine"
version = "0.1.0"
description = "Cosmu v2 deterministic engine, scorer, API, and audit spine."
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.8",
  "ccxt>=4.4",
  "fastapi>=0.115",
  "psycopg2-binary>=2.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",  # parse typed YAML front-matter in `.md` inbox specs (cosmu.lab.inbox)
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27", # required by fastapi.testclient, which engine:test imports — without it pytest collection errors
  "pytest>=8.3",
  "pytest-xdist>=3.5", # parallel test execution via -n auto (workers = CPU count)
  "pytest-timeout>=2.3", # bound every test so the pre-push gate (.githooks/pre-push) can never silently HANG
  "ruff>=0.7",
]
# The Modal client — ONLY needed where you invoke `modal run` (laptop / cloud session), never inside the
# Railway image (`pip install .` skips extras). Install with: pip install -e ".[remote]"  (or: pip install modal)
remote = [
  "modal>=0.64",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "allow_network: opt-out of the session-wide socket guard (for tests that genuinely need a live connection)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Package discovery for the build backend: ship the `cosmu` package (and subpackages); exclude tests.
[tool.setuptools.packages.find]
where = ["."]
include = ["cosmu*"]
exclude = ["tests*"]

# Ship non-Python data files INSIDE the wheel. Without this the SQL schema is left out of the installed
# package, so Store.migrate() (run at import) hits FileNotFoundError on schema.sql and the app never boots —
# the runtime "service unavailable" healthcheck failure. Keep the package self-contained, not cwd-dependent.
[tool.setuptools.package-data]
"*" = ["*.sql"]
