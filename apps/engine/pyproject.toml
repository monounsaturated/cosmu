[project]
name = "cosmu-engine"
version = "0.1.0"
description = "Cosmu v2 deterministic engine, scorer, API, and audit spine."
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.8",
  "ccxt>=4.4",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "evals: evaluation gates for agentic behavior",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
