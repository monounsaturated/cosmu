<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Environment · COSMU</title><style>:root{--bg:oklch(0.155 0.017 285);--surf:oklch(0.196 0.019 286);--surf2:oklch(0.230 0.020 286);--surf3:oklch(0.268 0.021 287);--surf4:oklch(0.308 0.022 287);--fg:oklch(0.965 0.004 286);--muted:oklch(0.68 0.014 286);--quiet:oklch(0.52 0.013 286);--hairline:oklch(0.240 0.013 286);--border:oklch(0.280 0.015 286);--iris:oklch(0.66 0.19 290);--iris-s:oklch(0.74 0.135 290);--iris-dim:oklch(0.66 0.19 290 / 0.12);--up:oklch(0.78 0.16 160);--up-dim:oklch(0.78 0.16 160 / 0.14);--down:oklch(0.70 0.17 18);--down-dim:oklch(0.70 0.17 18 / 0.14);--gold:oklch(0.82 0.14 85);--gold-dim:oklch(0.82 0.14 85 / 0.14);--r:12px;--r-sm:8px}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(900px 480px at 92% -8%,oklch(0.66 0.19 290 / 0.08) 0%,transparent 65%),var(--bg);color:var(--fg);min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
.wrap{max-width:960px;margin:0 auto;padding:26px 22px 60px}
.head{margin-bottom:18px}
.title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.summary{display:flex;gap:16px;margin-top:13px;flex-wrap:wrap}
.sm{font-size:11.5px;color:var(--quiet);font-variant-numeric:tabular-nums}.sm b{font-variant-numeric:tabular-nums}
.banner{font-size:11px;color:var(--quiet);background:var(--surf);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:8px 12px;margin-top:14px}
.banner code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--iris-s);font-size:10.5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.nm{font-weight:600;color:var(--fg)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--quiet)}
.host{font-size:10px;color:var(--muted);background:var(--surf3);border:1px solid var(--hairline);border-radius:5px;padding:1px 7px;white-space:nowrap}
.cat-tag{font-size:9.5px;color:var(--iris-s);background:var(--iris-dim);border-radius:5px;padding:1px 7px}
.note{font-size:10.5px;color:var(--gold);margin-top:7px}
/* table */
.svc-table{width:100%;border-collapse:collapse;background:var(--surf2);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 28px -10px rgba(0,0,0,.6)}
.svc-table th{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet);font-weight:700;text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--surf3) 70%,var(--surf2))}
.svc-table th.r,.svc-table td.r{text-align:right}
.svc-table td{padding:11px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.svc-table tr:last-child td{border-bottom:none}.svc-table tbody tr:hover td{background:oklch(0.66 0.19 290 / 0.05)}
/* cards */
.svc-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.svc-card{background:var(--surf2);border:1px solid var(--hairline);border-radius:var(--r);padding:13px 14px;box-shadow:0 6px 20px -10px rgba(0,0,0,.5)}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.sc-pow{font-size:11.5px;line-height:1.4}.sc-meta{display:flex;gap:6px;margin:9px 0 7px}.sc-var{word-break:break-all}
/* host groups */
.svc-group{background:var(--surf2);border:1px solid var(--hairline);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.sg-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--surf3) 60%,var(--surf2))}
.sg-name{font-weight:700;font-size:12.5px}
.sg-row{display:grid;grid-template-columns:8px 1.1fr 1.5fr 1.3fr auto;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--hairline)}
.sg-row:last-child{border-bottom:none}.sg-pow{font-size:11px}
/* category + view-only switch */
.svc-cat{margin-bottom:16px}
.scat-name{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--quiet);font-weight:700;margin:0 2px 7px}
.scat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surf2);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:6px}
.scat-r{display:flex;align-items:center;gap:11px}
.vswitch{width:30px;height:17px;border-radius:999px;background:var(--surf4);position:relative;flex-shrink:0;cursor:default}
.vswitch .vk{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--quiet);transition:none}
.vswitch.v-live{background:var(--up-dim)}.vswitch.v-live .vk{left:15px;background:var(--up)}
.vswitch.v-error{background:var(--down-dim)}.vswitch.v-error .vk{left:15px;background:var(--down)}
.vswitch.v-pending{background:var(--gold-dim)}.vswitch.v-pending .vk{left:15px;background:var(--gold)}
/* env view */
.env-top{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--quiet);margin-bottom:8px}
.env-view{background:#0d0d14;border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.env-line{display:flex;align-items:center;gap:9px;padding:3px 0;white-space:nowrap;overflow:hidden}
.env-key{color:var(--iris-s)}.env-eq{color:var(--quiet)}.env-val{color:var(--up)}.env-empty{color:var(--down)}.env-note{color:var(--muted)}
.env-where{margin-left:auto;color:var(--quiet);font-size:10px}
@media(max-width:720px){.svc-cards{grid-template-columns:1fr 1fr}.sg-row{grid-template-columns:8px 1fr auto}.sg-pow,.sg-row .mono{display:none}}
@media(max-width:480px){.svc-cards{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="head"><div class="title">Environment</div><div class="sub">The <code>.env</code> index — masked, view-only.</div><div class="summary" id="summary"></div><div class="banner">One place to see every key and whether it's live. Values are masked. <code>→ host</code> tells you where to add it.</div></div>
<div id="mount"></div></div>
<script>
var SVC=[
 {name:'Binance',cat:'Trading',powers:'Spot market data + live execution',host:'Railway',vars:['BINANCE_API_KEY','BINANCE_API_SECRET'],status:'live',note:'live trading stays OFF until armed'},
 {name:'Alpaca',cat:'Data',powers:'US-equities data + paper fills',host:'Railway',vars:['ALPACA_API_KEY','ALPACA_API_SECRET','ALPACA_PAPER_API_KEY'],status:'off',note:'paper keys not set — equity lane keyless (Yahoo) for now'},
 {name:'Supabase · Postgres',cat:'Infra',powers:'The store — strategies, tracks, fills, marks',host:'Railway · Supabase',vars:['DATABASE_URL'],status:'live'},
 {name:'Cloudflare R2',cat:'Infra',powers:'Cold data lake (Parquet hoard)',host:'Railway',vars:['R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET'],status:'off',note:'cold tier default-off — flip ALT_DATA_BACKEND when set'},
 {name:'OpenRouter',cat:'AI',powers:'LLM strategy authoring',host:'Railway',vars:['OPENROUTER_API_KEY'],status:'live'},
 {name:'xAI · Grok',cat:'Data',powers:'LiveSearch — tweets / news accrual',host:'Railway',vars:['XAI_API_KEY'],status:'error',note:'last call 401 — rotate the key'},
 {name:'LunarCrush',cat:'Data',powers:'Social-dominance signal',host:'Railway',vars:['LUNARCRUSH_API_KEY'],status:'off'},
 {name:'FRED',cat:'Data',powers:'Macro — VIX, rates',host:'Railway',vars:['FRED_API_KEY'],status:'live'},
 {name:'CryptoPanic',cat:'Data',powers:'News headlines',host:'Railway',vars:['CRYPTOPANIC_API_KEY'],status:'pending',note:'key set — not verified live yet'},
 {name:'DeFiLlama',cat:'Data',powers:'TVL / on-chain flows',host:'— (keyless)',vars:['(no key — public API)'],status:'live'},
 {name:'Slack',cat:'Notify',powers:'Alerts + daily summary',host:'Railway',vars:['SLACK_WEBHOOK_URL'],status:'live'},
 {name:'Railway',cat:'Infra',powers:'Engine + cron hosting',host:'Railway',vars:['(project-linked)'],status:'live'},
 {name:'Vercel',cat:'Infra',powers:'Web-app hosting',host:'Vercel',vars:['(project-linked)'],status:'live'}
];
var ST={live:{lbl:'Live',c:'var(--up)',bg:'var(--up-dim)'},off:{lbl:'Not set',c:'var(--quiet)',bg:'var(--surf3)'},error:{lbl:'Error',c:'var(--down)',bg:'var(--down-dim)'},pending:{lbl:'Set · unverified',c:'var(--gold)',bg:'var(--gold-dim)'}};
function dot(s){return '<span class="dot" style="background:'+ST[s].c+'"></span>';}
function pill(s){var m=ST[s];return '<span class="pill" style="color:'+m.c+';background:'+m.bg+'">'+dot(s)+m.lbl+'</span>';}
function count(s){return SVC.filter(function(x){return x.status===s;}).length;}
function summary(){return '<span class="sm"><b style="color:var(--up)">'+count('live')+'</b> live</span><span class="sm"><b style="color:var(--gold)">'+count('pending')+'</b> unverified</span><span class="sm"><b style="color:var(--down)">'+count('error')+'</b> error</span><span class="sm"><b style="color:var(--quiet)">'+count('off')+'</b> not set</span>';}

// ── layouts ──
function renderTable(){return '<table class="svc-table"><thead><tr><th></th><th>Service</th><th>Powers</th><th>Set in</th><th>Env var</th><th class="r">Status</th></tr></thead><tbody>'+SVC.map(function(s){return '<tr><td>'+dot(s.status)+'</td><td class="nm">'+s.name+'</td><td class="muted">'+s.powers+'</td><td><span class="host">'+s.host+'</span></td><td class="mono">'+s.vars.join(', ')+'</td><td class="r">'+pill(s.status)+'</td></tr>';}).join('')+'</tbody></table>';}
function renderCards(){return '<div class="svc-cards">'+SVC.map(function(s){return '<div class="svc-card"><div class="sc-top"><span class="nm">'+s.name+'</span>'+pill(s.status)+'</div><div class="muted sc-pow">'+s.powers+'</div><div class="sc-meta"><span class="host">'+s.host+'</span><span class="cat-tag">'+s.cat+'</span></div><div class="mono sc-var">'+s.vars.join('  ·  ')+'</div>'+(s.note?'<div class="note">'+s.note+'</div>':'')+'</div>';}).join('')+'</div>';}
function renderGroups(){var hosts={},order=[];SVC.forEach(function(s){if(!hosts[s.host]){hosts[s.host]=[];order.push(s.host);}hosts[s.host].push(s);});return order.map(function(h){return '<div class="svc-group"><div class="sg-head"><span class="sg-name">'+h+'</span><span class="muted">set these here · '+hosts[h].length+'</span></div>'+hosts[h].map(function(s){return '<div class="sg-row">'+dot(s.status)+'<span class="nm">'+s.name+'</span><span class="muted sg-pow">'+s.powers+'</span><span class="mono">'+s.vars.join(', ')+'</span>'+pill(s.status)+'</div>';}).join('')+'</div>';}).join('');}
function renderCats(){var cats={},order=['Trading','Data','AI','Infra','Notify'];SVC.forEach(function(s){(cats[s.cat]=cats[s.cat]||[]).push(s);});return order.filter(function(c){return cats[c];}).map(function(c){return '<div class="svc-cat"><div class="scat-name">'+c+'</div>'+cats[c].map(function(s){return '<div class="scat-row"><div class="scat-l"><div class="nm">'+s.name+'</div><div class="muted">'+s.powers+' · <span class="mono">'+s.vars.join(', ')+'</span></div></div><div class="scat-r"><span class="host">'+s.host+'</span><span class="vswitch v-'+s.status+'" title="'+ST[s.status].lbl+' · view-only"><span class="vk"></span></span></div></div>';}).join('')+'</div>';}).join('');}
function renderEnv(){var lines=SVC.map(function(s){return s.vars.map(function(v){var key=v.indexOf('(')===0;var val=key?'<span class="env-note">'+v+'</span>':(s.status==='off'?'<span class="env-empty"># unset</span>':'<span class="env-val">••••••••••••••••</span>');return '<div class="env-line">'+dot(s.status)+'<span class="env-key">'+(key?s.name:v)+'</span><span class="env-eq">'+(key?'':'=')+'</span>'+val+'<span class="env-where">→ '+s.host+'</span></div>';}).join('');}).join('');return '<div class="env-top"># .env.local — view-only index · '+SVC.length+' services · masked</div><div class="env-view">'+lines+'</div>';}

var MODE='env';
document.getElementById('mount').innerHTML=({table:renderTable,cards:renderCards,groups:renderGroups,cats:renderCats,env:renderEnv})[MODE]();
document.getElementById('summary').innerHTML=summary();
</script></body></html>
